[project]
name = "llm-fund"
version = "0.1.0"
description = "LLM がファンドマネージャー役として売買指示を生成し、人間が執行する投資判断 CLI"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "tenacity>=9.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
fund = "llm_fund.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "freezegun>=1.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_fund"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
